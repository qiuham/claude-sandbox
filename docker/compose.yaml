# 用法：
#   CCS_EXIT=socks5h://172.17.0.1:7897 docker compose -f docker/compose.yaml up --build
#
# 打开 http://localhost:6080/vnc.html 就能看到浏览器窗口。
# 容器里的 127.0.0.1 不是宿主机的代理，出口要用宿主机在容器网桥里的地址
# （Linux 默认 172.17.0.1，Docker Desktop 用 host.docker.internal）。

services:
  sandbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: claude-sandbox:local
    environment:
      CCS_NAME: ${CCS_NAME:-sandbox}
      CCS_EXIT: ${CCS_EXIT:-}
      CCS_SCREEN: ${CCS_SCREEN:-2560x1440x24}
    ports:
      - "6080:6080"
    volumes:
      # 账号数据放在宿主机，容器重建不丢
      - ${HOME}/sandboxes:/home/sandbox/sandboxes
      - ${HOME}/.config/claude-sandbox:/home/sandbox/.config/claude-sandbox
    shm_size: 1gb
    restart: unless-stopped
